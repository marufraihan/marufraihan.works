name: Build and publish site

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [sanity-publish]
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * *' # daily safety rebuild (03:17 Dhaka time)

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      SANITY_STUDIO_DATASET: production
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://marufraihan.works' }}
      NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Wait for more CMS changes (groups several publishes into one build)
        if: github.event_name == 'repository_dispatch'
        run: sleep 60
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            studio/package-lock.json
            web/package-lock.json
      - name: Build the CMS
        working-directory: studio
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build the website
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages project create marufraihan-works --production-branch=main 2>/dev/null || true
          npx --yes wrangler@4 pages deploy web/out --project-name=marufraihan-works --branch=main --commit-dirty=true
